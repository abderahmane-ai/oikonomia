# OCCUPATION lexicon — mined, not recalled.
#
# Trades and offices. Several share a stem with a currency or commodity.
#
# Every form below was observed adjacent to a <num> element in DDbDP at
# corpus rev d7a34f302d1e, via `oik lexicon mine`. The number after each form is
# its document frequency in that mining pass. Forms are folded (accents and
# breathings stripped, case folded, final sigma -> sigma): match against
# oikonomia.labeling.normalize output, never against raw text.
#
# `oik lexicon verify` re-checks every form against the corpus; a form that is
# not attested there is an error, not a harmless extra.

version: 1
category: OCCUPATION
entries:
