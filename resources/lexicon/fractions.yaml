# FRACTION lexicon — mined, not recalled.
#
# Fractional quantifiers that modify an amount rather than name a unit.
#
# Every form below was observed adjacent to a <num> element in DDbDP at
# corpus rev d7a34f302d1e, via `oik lexicon mine`. The number after each form is
# its document frequency in that mining pass. Forms are folded (accents and
# breathings stripped, case folded, final sigma -> sigma): match against
# oikonomia.labeling.normalize output, never against raw text.
#
# Curation removed homographs of other categories -- e.g. chalkeus
# (coppersmith) and sitologos (grain officer) are OCCUPATIONs, not a
# currency and a commodity, though they share a stem.

version: 1
category: FRACTION
entries:
  - id: half
    gloss: "half (hemisy)"
    forms:
      - ημισυ    # 773
      - ημισουσ    # 67
  - id: third
    gloss: "third (triton)"
    forms:
      - τριτον    # 276
      - τριτησ    # 82
      - τριτου    # 33
  - id: quarter
    gloss: "quarter (tetarton)"
    forms:
      - τεταρτον    # 325
      - τεταρτησ    # 69
      - τεταρτου    # 37
  - id: two_thirds
    gloss: "two thirds (dimoiron)"
    forms:
      - διμοιρον    # 75
