  # --- Phase-6 recall pass (2026-07-23): the property/land/animal goods the
  # gold repeatedly tags COMMODITY (sales, leases, loans on security) but the
  # commodity lexicon lacked (recall was 0.310). Corpus-attested inflections
  # (`oik lexicon verify`). NB the ονο- trap: ὄνομα "name" (ονοματ-) is NOT a
  # commodity, so only the ὄνος "donkey" forms are listed.
  - id: house
