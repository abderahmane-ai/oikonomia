# Silver-labeler patterns (Phase 6).
#
# These drive the labeling functions that no economic lexicon reaches — PERSON,
# PLACE, TRANSACTION, PERSON_ROLE, AGE — the categories the scorer showed the
# proximity baseline is structurally blind to (recall 0).
#
# Every string here is **folded** (lowercase, accents stripped, final sigma →
# σ) because matching happens in folded space; see labeling/normalize.py. Stems
# are matched as *token prefixes*, so "μισθωσ" covers μίσθωσις, μισθώσασθαι,
# μισθώσεως. They were read off the 65 gold documents plus their obvious
# inflections, not recalled — the same "measured, never recalled" rule the
# lexicons follow. Tune against `oik silver score`, not intuition.

# --- TRANSACTION: the word that names the legal act (verb or noun) ----------
# Gold surfaces: ὁμολογῶ/ὁμολογία, μίσθωσις/μισθώσασθαι, δάνειον, πέπρακά,
# ἠγόρασα, ἐκτησάμην, συνχωρεῖ, ἐξοικονομοῦντες, παρεχώρησα.
transaction_stems:
  - ομολογ      # ὁμολογία, ὁμολογῶ, ὁμολογεῖ, ὁμολογοῦμεν
  - ωμολογ      # ὡμολόγησα
  - μισθωσ      # μίσθωσις, μισθώσασθαι, μισθώσεως
  - εμισθωσ     # ἐμίσθωσαν, ἐμισθώσατο
  - μεμισθωκ    # μεμίσθωκα (perfect)
  - μισθωθ      # μισθωθῆναι
  - δανει       # δάνειον, δανείου
  - δανεισ      # δανείσματος, ἐδάνεισα (see εδανεισ)
  - εδανεισ     # ἐδάνεισα
  - πρασ        # πρᾶσις, πρᾶσιν (sale)
  - πεπρακ      # πέπρακα (I have sold)
  - επρα        # ἐπράθη (was sold)
  - εωνη        # ἐωνήθη, ἐωνησάμην (purchase)
  - ηγορασ      # ἠγόρασα
  - αγορασ      # ἀγοράσαι, ἀγορασθέντος
  - κτησ        # κτῆσις
  - εκτησ       # ἐκτησάμην
  - παραχωρ     # παραχωρέω (cede)
  - παρεχωρ     # παρεχώρησα
  - συγχωρ      # συγχωρέω
  - συνχωρ      # συνχωρεῖ (non-assimilated spelling)
  - διαστειλ    # διαστείλατε (bank pay-order)
  - εξοικονομ   # ἐξοικονομέω (dispose of)

# --- PERSON_ROLE: a party named only by role/status/kinship -----------------
# The role *word*, not the person. Gold: μετὰ κυρίου, τῆς γυναικός, δούλου,
# κληρονόμοις, ἀπελευθέρα, ἀφηλίκων, ματρώνᾳ.
role_stems:
  - γυναικ      # γυναικός, γυναῖκα
  - γυνη        # γυνή
  - ανδρ        # ἀνδρός (husband)
  - ανηρ        # ἀνήρ
  - δουλ        # δούλου (slave, as status of a party)
  - θρεπτ       # θρεπτός (foster-child)
  - απελευθερ   # ἀπελεύθερος/-α (freed person)
  - αφηλικ      # ἀφῆλιξ (minor)
  - κληρονομο   # κληρονόμος (heir) — NOT κληρονομία (inheritance, a thing)
  - ματρων      # ματρώνα
  - ορφαν       # ὀρφανός
  - διασημ      # διασημότατος (vir perfectissimus, an honorific rank)
# κύριος over-fires: as "lord/valid/master" it is not a party. It is a role
# only in the guardian formula, so it is gated behind μετά/χωρίς.
role_guarded_stems: [κυρι]
role_guard_determiners: [μετα, χωρις]
# Determiners pulled into a role span when they immediately precede the role
# word: τῆς γυναικός, τοῦ ἀνδρός, τὴν γυναῖκα.
role_determiners: [τησ, του, τον, την, τω, τη]

# --- PLACE: admin geography and toponyms ------------------------------------
# Lowercase administrative nouns that are *part of* a PLACE span and signal it:
# κώμης Τερύθεως, Ὀξυρύγχων πόλεως, Ἡρακλείδου μερίδος, Εἰρηναίου κλήρου.
place_admin_stems:
  - κωμ         # κώμη, κώμης, κώμῃ
  - πολε        # πόλεως
  - πολει       # πόλει
  - πολισ       # πόλις
  - πολιν       # πόλιν
  - μεριδ       # μερίδος, μερίδι (administrative division)
  - νομου       # νομοῦ (nome)
  - νομω        # νομῷ
  - κληρου      # κλήρου (land parcel — keeps the eponym from reading as PERSON)
  - κληρω       # κλήρῳ
  - τοπαρχ      # τοπαρχία
  - αμφοδ       # ἄμφοδον (city quarter)
  - μητροπολ    # μητρόπολις
  - εποικ       # ἐποίκιον (hamlet)
# Prepositions that *signal* a following place but are not part of the span.
place_prepositions: [εν, εισ, απο, επι, εξ, εκ]
# Toponym stems — a weak secondary signal for an isolated capitalised token
# (context above is primary). Deliberately short; expand from a TM/Pleiades
# gazetteer later.
place_gazetteer_stems:
  - αλεξανδρε   # Ἀλεξάνδρεια / Ἀλεξανδρεύς — the -ε- keeps the place & ethnic
                # but excludes the person Ἀλέξανδρος (Ἀλεξάνδρ-ο-υ)
  - οξυρυγχ     # Ὀξύρυγχος
  - αρσινο      # Ἀρσινοΐτης
  - ερμουπολ    # Ἑρμούπολις
  - σοκνοπαι    # Σοκνοπαίου Νῆσος
  - φιλαδελφ    # Φιλαδέλφεια
  - καρανιδ     # Καρανίς
  - τεβτυν      # Τεβτῦνις
  - θεαδελφ     # Θεαδέλφεια
  - διονυσιαδ   # Διονυσιάς
  - αντινο      # Ἀντινόου πόλις
  - βαβυλων     # Βαβυλών
  - μεμφ        # Μέμφις
  - ρωμ         # Ῥώμη

# --- PERSON: capitalisation, filiation, and what to exclude -----------------
# Lowercase particles that bridge two capitalised tokens into ONE person span
# (filiation and alias): Πτολεμαὶς Χαιρήμονος τοῦ Χαιρήμονος; Κιαλῆς ὃς καὶ
# Νεφερῶς. Bare καί does NOT bridge (X καὶ Y are two parties) — only the alias
# "ὁ/ὃς καὶ" does, handled in code.
name_bridge_articles: [του, τησ, τω, τη, τον, την, το]
name_bridge_junior: [νεωτεροσ, νεωτερου, νεωτερον, νεωτερα, πρεσβυτεροσ, πρεσβυτερου, πρεσβυτερον]
name_alias_pronouns: [ο, η, οσ, ητισ]
# Imperial titulature: a capitalised token whose fold starts with one of these
# is an honorific, not a name. A run made ONLY of titulature (a bare dating
# formula, "Αὐτοκρατόρων Σεβαστῶν") is dropped; a run that also holds a real
# name (Δομιτιανοῦ Σεβαστοῦ Γερμανικοῦ) is kept whole as the ruler's PERSON.
titulature_stems:
  - σεβαστ      # Σεβαστός (Augustus)
  - αυτοκρατ    # Αὐτοκράτωρ (Imperator)
  - καισ        # Καῖσαρ
  - αυγουστ     # Αὔγουστος
  - μεγιστ      # Μέγιστος (Maximus)
  - ευσεβ       # Εὐσεβής (Pius)
  - γερμανικ    # Γερμανικός
  - βρεταννικ   # Βρεταννικός
  - παρθικ      # Παρθικός
  - δακικ       # Δακικός
  - αραβικ      # Ἀραβικός
  - αδιαβηνικ   # Ἀδιαβηνικός
  - μηδικ       # Μηδικός
  - περσικ      # Περσικός
  - σαρματικ    # Σαρματικός
  - ευτυχ       # Εὐτυχής (Felix)
  - θεου        # θεοῦ (divine, in the imperial style)
  - νικητ       # Νικητής
  - ανικητ      # Ἀνίκητος (Invictus)

# --- Relations --------------------------------------------------------------
# A capitalised name introduced by one of these is a party to the transaction
# (παρὰ Πανίσκου "from Paniskos", διὰ X "through X"). Linking *every* person to
# the transaction is what wrecked PARTY_OF precision; this gates it.
party_prepositions: [παρα, δια, υπο]

# Month names (Egyptian + Macedonian calendars). A capitalised month leaks into
# PERSON when the date lexicon misses that spelling (Θῶυτ, Ὑπερβερεταίου); these
# stems block that — a month is never a person.
month_stems:
  - θωθ
  - θωυτ
  - φαωφι
  - αθυρ
  - χοιαχ
  - χοιακ
  - τυβι
  - μεχειρ
  - φαμενωθ
  - φαρμουθι
  - παχων
  - παυνι
  - επειφ
  - επιφ
  - μεσορη
  - υπερβερετ
  - δυστρ
  - ξανδικ
  - αρτεμισι
  - δαισι
  - πανημ
  - λωι
  - γορπιαι
  - υπερβερεταιου

# --- AGE: a numeral tagged as a person's age --------------------------------
# ἐτῶν κ ("of 20 years"). A numeral immediately next to this marker is an AGE,
# not a quantity.
age_marker_stems: [ετων]

# --- PAYMENT DIRECTION (PAID_BY / PAID_TO) ----------------------------------
# Who paid whom is read off the VERB, because the same case flips role by verb:
# 'ἐσχηκέναι παρὰ σοῦ' (subject RECEIVED -> subject is payee, παρά is payer) vs
# 'διέγραψεν X τῷ Y' (subject PAID -> subject is payer, dative is payee). The
# three classes and their co-occurrence with παρά / a destination preposition
# were mined over the whole corpus (scratchpad/mine_payment_verbs.py):
#   receiver verbs co-occur with παρά 40-65%; giver/impersonal with εἰς/ἐπί.
# Every rule fires only when an AMOUNT (MONEY_AMOUNT/COMMODITY) sits near the
# verb — the filter that separates 'received the money' from 'received the
# letter' (κομίζομαι) and the παρά-of-a-petition-sender trap. Stems are folded.

# Receiver verbs: subject = PAYEE, παρά+gen = PAYER. High precision on the payer.
payment_receiver_stems:
  - απεχ       # ἀπέχω — "I have (received) in full"
  - απεσχ      # ἀπέσχον
  - απεσχηκ    # ἀπεσχηκέναι
  - εσχηκ      # ἐσχηκέναι — "having received" (loans, receipts)
  - εσχον      # ἔσχον
  - ειληφ      # εἴληφα — "I have taken/received"
  - κεκομισ    # κεκόμισμαι — "I have recovered"
  - εκομισ     # ἐκομισάμην
  - κομισαμ    # κομισάμενος
  - παρελαβ    # παρέλαβον — "I received"
  - εχειν      # ὁμολογεῖ ... ἔχειν παρὰ X — "acknowledges having (received) from X"

# Giver verbs: subject = PAYER, dative/εἰς = PAYEE. High precision on the payer.
payment_giver_stems:
  - διεγραψ    # διέγραψε(ν) — paid through a bank (tax receipts)
  - διαγεγραφ  # διαγέγραφα
  - μεμετρηκ   # μεμέτρηκα — measured out grain (payment in kind)
  - εμετρησ    # ἐμέτρησα
  - καταβαλ    # καταβάλλω / καταβαλεῖν — pay down
  - καταβεβλ   # καταβέβληκα
  - ετελεσ     # ἐτέλεσα — paid (a tax)
  - τετελεκ    # τετέλεκα

# Impersonal bank receipt: payee = ἐπὶ τὴν τράπεζαν, payer = the taxpayer named
# after the bank clause. Lower precision (payer must be picked past the banker).
payment_impersonal_stems:
  - τετακ      # τέτακται — "it has been paid (to the bank)"

# Folded dative endings — the giver-verb's following name is usually the PAYEE
# in the dative (Ἀντιπάτρωι, Σεκούνδῳ→σεκουνδω, Πελαίαι, Ζήνωνι). Both the
# adscript (ωι) and subscript (ῳ→ω after folding) forms occur in the corpus.
# Checked on the span's HEAD token (filiation that follows is genitive).
dative_endings: [ωι, ω, αι, οισ, αισ, ι]

# Officials named in the dating/registration formula, not payers. A παρά-name
# followed by one of these — "ἐφʼ Ἑρμίου τοῦ παρὰ Πανίσκου ἀγορανόμου" (before
# X the agoranomos) — is the scribe/official, and was wrongly taken as the payer
# before this guard. So a παρά-name whose next token is one of these is excluded
# from the payer candidates.
official_stems:
  - αγορανομ   # ἀγορανόμος — market official who registers the deal (dating clause)
  - μνημον     # μνήμων — registrar
